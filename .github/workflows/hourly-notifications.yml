name: Notifications toutes les 15 minutes

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-notifications
  cancel-in-progress: false

jobs:
  notifications:
    name: Vérifier les notifications à envoyer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler le planificateur SAFARUMA
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 120 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://safaruma.com/api/cron/notifications
