name: Operator script safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  operator-script-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect scripts without running them or accessing production
        run: npx --no-install tsx --test tests/operator-script-safety.test.ts
